name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: target/datashare-extension-whisper-*.jar
          generate_release_notes: true
          body: |
            ## Datashare Whisper Transcription Extension v${{ steps.get_version.outputs.VERSION }}

            Audio/Video transcription using OpenAI's Whisper model.

            ### Features
            - Multi-format support (MP3, WAV, MP4, M4A, FLAC, etc.)
            - 99 language support with auto-detection
            - 5 model sizes (tiny to large)
            - Configurable timeouts and options

            ### Installation

            Download the JAR and place in your Datashare extensions directory:
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/v${{ steps.get_version.outputs.VERSION }}/datashare-extension-whisper-${{ steps.get_version.outputs.VERSION }}-jar-with-dependencies.jar
            ```

            See [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) for full documentation.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
